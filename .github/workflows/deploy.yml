name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Publish dist to the gh-pages branch
        run: |
          git fetch origin gh-pages
          git worktree add ../site origin/gh-pages
          cd ../site
          git rm -rq .
          cp -r "$GITHUB_WORKSPACE/dist/." .
          touch .nojekyll
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Deploy $GITHUB_SHA"
          git push origin HEAD:gh-pages
